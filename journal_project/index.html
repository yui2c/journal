<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>دفتر خاص</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&family=Reem+Kufi+Ink&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <main id="auth" class="auth-screen">
    <section class="auth-card">
      <p class="eyebrow">مساحة خاصة</p>
      <h1>دفتر خاص</h1>
      <p class="muted">مكانٌ صغير لكل ما يستحق أن يُكتب.</p>

      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email" placeholder="name@example.com">

      <label for="password">كلمة المرور</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="••••••••">

      <div class="auth-actions">
        <button id="loginBtn" class="primary-btn" type="button">تسجيل الدخول</button>
        <button id="signupBtn" class="soft-btn" type="button">إنشاء حساب</button>
      </div>

      <p id="authMessage" class="status" aria-live="polite"></p>
    </section>
  </main>

  <main id="journal" class="hidden">

    <section id="cover" class="cover-screen">
      <div class="cover-wrap">

        <div class="leather-cover">
          <div class="cover-line"></div>

          <div class="charms">

            <button class="charm shell-charm" type="button" aria-label="صدفة">
              <svg viewBox="0 0 80 90">
                <defs>
                  <linearGradient id="shellSilver" x2="1" y2="1">
                    <stop stop-color="#fff"/>
                    <stop offset=".45" stop-color="#92979b"/>
                    <stop offset=".7" stop-color="#f8f8f8"/>
                    <stop offset="1" stop-color="#777"/>
                  </linearGradient>
                </defs>

                <path d="M40 8 C17 8 6 25 9 49 C12 68 28 81 40 85 C52 81 68 68 71 49 C74 25 63 8 40 8Z"
                  fill="url(#shellSilver)" stroke="#777" stroke-width="2"/>

                <g fill="none" stroke="#777" stroke-width="1.8">
                  <path d="M40 12V81"/>
                  <path d="M40 12Q20 29 17 67"/>
                  <path d="M40 12Q60 29 63 67"/>
                  <path d="M40 15Q29 35 25 74"/>
                  <path d="M40 15Q51 35 55 74"/>
                </g>
              </svg>
            </button>

            <button class="charm initials" type="button" aria-label="SA">
              <svg viewBox="0 0 100 90">
                <defs>
                  <linearGradient id="letterSilver" x2="1" y2="1">
                    <stop stop-color="#fff"/>
                    <stop offset=".5" stop-color="#92979b"/>
                    <stop offset=".75" stop-color="#f8f8f8"/>
                    <stop offset="1" stop-color="#777"/>
                  </linearGradient>
                </defs>

                <text x="5" y="65" font-family="Georgia" font-size="65" font-weight="bold"
                  fill="url(#letterSilver)" stroke="#777" stroke-width="1">S</text>

                <text x="43" y="75" font-family="Georgia" font-size="65" font-weight="bold"
                  fill="url(#letterSilver)" stroke="#777" stroke-width="1">A</text>
              </svg>
            </button>

            <button class="charm key-charm" type="button" aria-label="مفتاح">
              <svg viewBox="0 0 80 90">
                <defs>
                  <linearGradient id="keySilver" x2="1" y2="1">
                    <stop stop-color="#fff"/>
                    <stop offset=".5" stop-color="#999da0"/>
                    <stop offset=".75" stop-color="#f5f5f5"/>
                    <stop offset="1" stop-color="#777"/>
                  </linearGradient>
                </defs>

                <path d="M40 8 C22 8 12 20 12 34 C12 47 21 56 33 57 L33 79 L43 79 L43 68 L53 68 L53 58 L43 58 L43 51 C58 49 68 39 68 26 C68 15 56 8 40 8Z"
                  fill="url(#keySilver)" stroke="#777" stroke-width="2"/>

                <circle cx="40" cy="30" r="11" fill="#171717" stroke="#eee" stroke-width="3"/>
              </svg>
            </button>

          </div>
        </div>

        <button id="openJournalBtn" class="open-btn" type="button">
          افتحي الدفتر
        </button>

      </div>

      <button id="logoutBtn" class="logout-cover" type="button">
        تسجيل الخروج
      </button>
    </section>

    <section id="desk" class="desk-screen hidden">

      <header class="topbar">
        <div>
          <p class="eyebrow">دفتر خاص</p>
          <h1>مساحة الكتابة</h1>
        </div>

        <button id="backCoverBtn" class="soft-btn" type="button">
          الغلاف
        </button>
      </header>

      <section class="controls-panel">

        <div class="control-row">
          <label for="sectionSelect">القسم</label>
          <select id="sectionSelect"></select>

          <button id="addSectionBtn" class="soft-btn" type="button">قسم جديد</button>
          <button id="editSectionBtn" class="soft-btn" type="button">تعديل الاسم</button>
          <button id="deleteSectionBtn" class="danger-btn" type="button">حذف القسم</button>
        </div>

        <div class="control-row entry-controls">

          <button id="newEntryBtn" class="soft-btn" type="button">
            صفحة جديدة
          </button>

          <label for="entryTitle">العنوان</label>
          <input id="entryTitle" type="text" placeholder="عنوان الصفحة">

          <label for="entryDate">التاريخ</label>
          <input id="entryDate" type="date">

          <button id="saveBtn" class="primary-btn" type="button">
            حفظ الصفحة
          </button>

          <label class="upload-btn" for="photoInput">
            إضافة صور
          </label>

          <input id="photoInput" type="file"
            accept="image/jpeg,image/png,image/webp,image/gif"
            multiple hidden>

        </div>

        <div class="status-row">
          <span id="saveStatus" class="status"></span>
          <span id="pageCounter" class="muted"></span>
        </div>

        <div id="entryList" class="entry-list"></div>

      </section>

      <div class="book-navigation">
        <button id="prevBtn" class="soft-btn" type="button">← السابقة</button>

        <span class="muted">
          اسحبي للانتقال بين الصفحات، أو استخدمي الأزرار.
        </span>

        <button id="nextBtn" class="soft-btn" type="button">التالية →</button>
      </div>

      <section id="book" class="book">

        <article id="leftPage" class="page">

          <div class="page-topline">
            <span id="leftDate"></span>
            <span id="leftNumber"></span>
          </div>

          <div id="leftWritingArea"
            class="writing-area"
            contenteditable="true"
            spellcheck="false"
            data-placeholder="اكتبي هنا...">
          </div>

          <div id="leftPhotoLayer" class="photo-layer"></div>

        </article>

        <article id="rightPage" class="page">

          <div class="page-topline">
            <span id="rightDate"></span>
            <span id="rightNumber"></span>
          </div>

          <div id="rightWritingArea"
            class="writing-area"
            contenteditable="true"
            spellcheck="false"
            data-placeholder="اكتبي هنا...">
          </div>

          <div id="rightPhotoLayer" class="photo-layer"></div>

        </article>

      </section>

      <p class="page-hint">
        يمكنك الكتابة في الصفحتين. اسحبي الصورة لتحريكها،
        واسحبي مقبض الزاوية لتغيير حجمها.
      </p>

    </section>

  </main>

  <dialog id="sectionDialog" class="section-dialog">
    <form id="sectionForm">

      <h2 id="sectionDialogTitle">إضافة قسم</h2>

      <label for="sectionName">اسم القسم</label>
      <input id="sectionName" type="text" maxlength="80" required>

      <div class="dialog-actions">
        <button class="primary-btn" type="submit">حفظ</button>
        <button id="cancelSectionBtn" class="soft-btn" type="button">إلغاء</button>
      </div>

    </form>
  </dialog>

  <script type="module" src="app.js"></script>

</body>
</html>
